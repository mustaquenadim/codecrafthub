<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeCraftHub: Your Learning Management Platform</title>
  <style>
    :root {
      --primary: #8B5CF6;
      --primary-dark: #7C3AED;
      --primary-light: #A78BFA;
      --success: #F59E0B;
      --success-dark: #D97706;
      --danger: #EF4444;
      --danger-dark: #DC2626;
      --bg: #0F0F1A;
      --surface: #1A1A2E;
      --surface-light: #25253D;
      --border: #2E2E4A;
      --text: #E4E4E7;
      --text-muted: #9CA3AF;
      --text-dim: #6B7280;
      --radius: 12px;
      --radius-sm: 8px;
      --transition: 0.2s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface-light) 100%);
      border-bottom: 3px solid var(--primary);
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary-light);
      letter-spacing: -0.5px;
    }

    .header .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }

    /* Container */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    /* Section title */
    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title .icon {
      width: 8px;
      height: 24px;
      background: var(--primary);
      border-radius: 4px;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    /* Form */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group label .required {
      color: var(--danger);
    }

    input, textarea, select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 0.6rem 0.8rem;
      font-size: 0.9rem;
      font-family: inherit;
      transition: border-color var(--transition), box-shadow var(--transition);
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
    }

    input.error, textarea.error, select.error {
      border-color: var(--danger);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* Buttons */
    .btn {
      border: none;
      border-radius: var(--radius-sm);
      padding: 0.65rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background var(--transition), opacity var(--transition), transform var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-success {
      background: var(--success);
      color: #1A1A2E;
    }

    .btn-success:hover {
      background: var(--success-dark);
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-danger:hover {
      background: var(--danger-dark);
    }

    .btn-secondary {
      background: var(--surface-light);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .btn-sm {
      padding: 0.4rem 0.7rem;
      font-size: 0.8rem;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .form-actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    /* Alert messages */
    .alert {
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
    }

    .alert.show {
      display: flex;
    }

    .alert-success {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid var(--danger);
      color: var(--danger);
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-overlay {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    .loading-overlay .spinner {
      width: 32px;
      height: 32px;
      border-width: 3px;
      border-color: var(--border);
      border-top-color: var(--primary);
    }

    .loading-overlay p {
      margin-top: 0.75rem;
      font-size: 0.9rem;
    }

    /* Course table */
    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
    }

    thead th {
      text-align: left;
      padding: 0.75rem 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 2px solid var(--border);
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background var(--transition);
    }

    tbody tr:hover {
      background: var(--surface-light);
    }

    tbody td {
      padding: 0.85rem 1rem;
      font-size: 0.875rem;
    }

    .course-name {
      font-weight: 600;
      color: var(--text);
    }

    .course-desc {
      color: var(--text-muted);
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Status badges */
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .status-not-started {
      background: rgba(156, 163, 175, 0.15);
      color: var(--text-muted);
      border: 1px solid var(--text-dim);
    }

    .status-in-progress {
      background: rgba(139, 92, 246, 0.15);
      color: var(--primary-light);
      border: 1px solid var(--primary);
    }

    .status-completed {
      background: rgba(245, 158, 11, 0.15);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .action-cell {
      display: flex;
      gap: 0.4rem;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    .empty-state .empty-icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      animation: modalIn 0.2s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .modal-header h2 {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--primary-light);
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      transition: color var(--transition);
    }

    .modal-close:hover {
      color: var(--text);
    }

    .modal .form-grid {
      grid-template-columns: 1fr;
    }

    /* Responsive */
    @media (max-width: 700px) {
      .header h1 {
        font-size: 1.3rem;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-actions {
        flex-direction: column;
      }

      .table-wrapper .mobile-cards {
        display: block;
      }

      table {
        display: none;
      }

      .mobile-cards {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .mobile-card {
        background: var(--surface-light);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 1rem;
      }

      .mobile-card .mc-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }

      .mobile-card .mc-name {
        font-weight: 600;
        font-size: 0.95rem;
      }

      .mobile-card .mc-desc {
        color: var(--text-muted);
        font-size: 0.82rem;
        margin-bottom: 0.5rem;
      }

      .mobile-card .mc-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        font-size: 0.78rem;
        color: var(--text-muted);
      }

      .mobile-card .mc-meta span {
        display: flex;
        align-items: center;
        gap: 0.25rem;
      }

      .mobile-card .mc-actions {
        display: flex;
        gap: 0.4rem;
      }
    }

    @media (min-width: 701px) {
      .mobile-cards {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>CodeCraftHub: Your Learning Management Platform</h1>
    <p class="subtitle">Plan, track, and complete your learning journey</p>
  </header>

  <div class="container">
    <!-- Alert container -->
    <div id="alertContainer"></div>

    <!-- Add Course Form -->
    <div class="card">
      <div class="section-title">
        <span class="icon"></span>
        Add New Course
      </div>
      <form id="courseForm">
        <div class="form-grid">
          <div class="form-group full">
            <label for="name">Course Name <span class="required">*</span></label>
            <input type="text" id="name" name="name" placeholder="e.g. Advanced JavaScript" />
          </div>
          <div class="form-group full">
            <label for="description">Description <span class="required">*</span></label>
            <textarea id="description" name="description" placeholder="Brief description of the course..."></textarea>
          </div>
          <div class="form-group">
            <label for="target_date">Target Date <span class="required">*</span></label>
            <input type="date" id="target_date" name="target_date" />
          </div>
          <div class="form-group">
            <label for="status">Status <span class="required">*</span></label>
            <select id="status" name="status">
              <option value="">Select status...</option>
              <option value="Not Started">Not Started</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submitBtn">
              Add Course
            </button>
            <button type="button" class="btn btn-secondary" id="resetBtn">
              Clear
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- Course List -->
    <div class="card">
      <div class="section-title">
        <span class="icon"></span>
        Your Courses
      </div>

      <div id="courseListContainer">
        <!-- Loading state, table, mobile cards, or empty state injected here -->
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Edit Course</h2>
        <button class="modal-close" id="closeModalBtn">&times;</button>
      </div>
      <div id="modalAlert"></div>
      <form id="editForm">
        <input type="hidden" id="editId" />
        <div class="form-grid">
          <div class="form-group full">
            <label for="editName">Course Name <span class="required">*</span></label>
            <input type="text" id="editName" />
          </div>
          <div class="form-group full">
            <label for="editDescription">Description <span class="required">*</span></label>
            <textarea id="editDescription"></textarea>
          </div>
          <div class="form-group full">
            <label for="editTargetDate">Target Date <span class="required">*</span></label>
            <input type="date" id="editTargetDate" />
          </div>
          <div class="form-group full">
            <label for="editStatus">Status <span class="required">*</span></label>
            <select id="editStatus">
              <option value="Not Started">Not Started</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-success" id="updateBtn">
              Save Changes
            </button>
            <button type="button" class="btn btn-secondary" id="cancelEditBtn">
              Cancel
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script>
    // API Configuration: the local CodeCraftHub backend (Node.js + Express)
    const API_URL = 'http://localhost:5000/api/courses';
    const HEADERS = {
      'Content-Type': 'application/json',
    };

    // DOM elements
    const courseForm = document.getElementById('courseForm');
    const submitBtn = document.getElementById('submitBtn');
    const resetBtn = document.getElementById('resetBtn');
    const courseListContainer = document.getElementById('courseListContainer');
    const alertContainer = document.getElementById('alertContainer');
    const editModal = document.getElementById('editModal');
    const editForm = document.getElementById('editForm');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const updateBtn = document.getElementById('updateBtn');
    const modalAlert = document.getElementById('modalAlert');

    // ============ State ============
    let courses = [];

    // ============ Alert helpers ============
    function showAlert(message, type) {
      const alertEl = document.createElement('div');
      alertEl.className = 'alert alert-' + type + ' show';
      alertEl.innerHTML = '<span>' + escapeHtml(message) + '</span>';
      alertContainer.appendChild(alertEl);
      setTimeout(function() {
        alertEl.classList.remove('show');
        setTimeout(function() { alertEl.remove(); }, 300);
      }, 4000);
    }

    function showModalAlert(message, type) {
      modalAlert.innerHTML = '<div class="alert alert-' + type + ' show"><span>' + escapeHtml(message) + '</span></div>';
      setTimeout(function() {
        modalAlert.innerHTML = '';
      }, 4000);
    }

    function clearAlerts() {
      alertContainer.innerHTML = '';
    }

    // ============ Utility ============
    // Escapes quotes too, because some values are placed inside attributes (title="...")
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      var div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Turns a network failure (server offline, CORS) into a helpful message
    function friendlyError(err) {
      if (err instanceof TypeError) {
        return 'Cannot reach the API at http://localhost:5000. Make sure the backend is running.';
      }
      return err.message;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      // Read plain YYYY-MM-DD dates as local dates so they don't shift by a day
      var d = /^\d{4}-\d{2}-\d{2}$/.test(dateStr) ? new Date(dateStr + 'T00:00:00') : new Date(dateStr);
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function statusClass(status) {
      if (status === 'Not Started') return 'status-not-started';
      if (status === 'In Progress') return 'status-in-progress';
      if (status === 'Completed') return 'status-completed';
      return 'status-not-started';
    }

    function setButtonLoading(btn, loading, originalText) {
      if (loading) {
        btn.disabled = true;
        btn.dataset.original = btn.textContent;
        btn.innerHTML = '<span class="spinner"></span> ' + (originalText || 'Loading...');
      } else {
        btn.disabled = false;
        btn.innerHTML = btn.dataset.original || originalText || btn.textContent;
      }
    }

    // ============ Validation ============
    function validateForm(name, description, targetDate, status) {
      var errors = [];

      if (!name || !name.trim()) errors.push('Course name is required');
      if (!description || !description.trim()) errors.push('Description is required');
      if (!targetDate) errors.push('Target date is required');
      if (!status) errors.push('Status is required');

      if (targetDate && isNaN(Date.parse(targetDate))) {
        errors.push('Target date must be a valid date');
      }

      var validStatuses = ['Not Started', 'In Progress', 'Completed'];
      if (status && validStatuses.indexOf(status) === -1) {
        errors.push('Invalid status value');
      }

      return errors;
    }

    // ============ API Functions ============
    async function fetchCourses() {
      showLoadingState();
      try {
        var response = await fetch(API_URL, { method: 'GET', headers: HEADERS });
        if (!response.ok) {
          var errData = await response.json().catch(function() { return {}; });
          throw new Error(errData.error || 'Failed to fetch courses (' + response.status + ')');
        }
        courses = await response.json();
        renderCourses();
      } catch (err) {
        showErrorState(friendlyError(err));
      }
    }

    async function createCourse(courseData) {
      setButtonLoading(submitBtn, true, 'Adding...');
      try {
        var response = await fetch(API_URL, {
          method: 'POST',
          headers: HEADERS,
          body: JSON.stringify(courseData),
        });
        if (!response.ok) {
          var errData = await response.json().catch(function() { return {}; });
          throw new Error(errData.error || 'Failed to create course (' + response.status + ')');
        }
        var newCourse = await response.json();
        courses.unshift(newCourse);
        renderCourses();
        showAlert('Course "' + newCourse.name + '" added successfully!', 'success');
        courseForm.reset();
      } catch (err) {
        showAlert(friendlyError(err), 'error');
      } finally {
        setButtonLoading(submitBtn, false, 'Add Course');
      }
    }

    async function updateCourse(id, courseData) {
      setButtonLoading(updateBtn, true, 'Saving...');
      try {
        var response = await fetch(API_URL + '/' + id, {
          method: 'PUT',
          headers: HEADERS,
          body: JSON.stringify(courseData),
        });
        if (!response.ok) {
          var errData = await response.json().catch(function() { return {}; });
          throw new Error(errData.error || 'Failed to update course (' + response.status + ')');
        }
        var updated = await response.json();
        var idx = courses.findIndex(function(c) { return c.id === id; });
        if (idx !== -1) {
          courses[idx] = updated;
        }
        renderCourses();
        closeModal();
        showAlert('Course updated successfully!', 'success');
      } catch (err) {
        showModalAlert(friendlyError(err), 'error');
      } finally {
        setButtonLoading(updateBtn, false, 'Save Changes');
      }
    }

    async function deleteCourse(id) {
      // Look up the name here instead of passing it through the onclick attribute
      var course = courses.find(function(c) { return c.id === id; });
      var name = course ? course.name : 'this course';
      if (!confirm('Are you sure you want to delete "' + name + '"?')) return;

      try {
        // The API answers 204 No Content (empty body), so the body is only read on errors
        var response = await fetch(API_URL + '/' + id, {
          method: 'DELETE',
          headers: HEADERS,
        });
        if (!response.ok) {
          var errData = await response.json().catch(function() { return {}; });
          throw new Error(errData.error || 'Failed to delete course (' + response.status + ')');
        }
        courses = courses.filter(function(c) { return c.id !== id; });
        renderCourses();
        showAlert('Course "' + name + '" deleted successfully!', 'success');
      } catch (err) {
        showAlert(friendlyError(err), 'error');
      }
    }

    // ============ Rendering ============
    function showLoadingState() {
      courseListContainer.innerHTML =
        '<div class="loading-overlay">' +
          '<div class="spinner"></div>' +
          '<p>Loading courses...</p>' +
        '</div>';
    }

    function showErrorState(message) {
      courseListContainer.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-icon">!</div>' +
          '<p>' + escapeHtml(message) + '</p>' +
          '<button class="btn btn-primary" style="margin-top:1rem" onclick="fetchCourses()">Retry</button>' +
        '</div>';
    }

    function renderCourses() {
      if (courses.length === 0) {
        courseListContainer.innerHTML =
          '<div class="empty-state">' +
            '<div class="empty-icon">+</div>' +
            '<p>No courses yet. Add your first course above!</p>' +
          '</div>';
        return;
      }

      // Desktop table
      var tableHtml =
        '<div class="table-wrapper">' +
        '<table>' +
          '<thead><tr>' +
            '<th>Course</th>' +
            '<th>Description</th>' +
            '<th>Target Date</th>' +
            '<th>Status</th>' +
            '<th>Created</th>' +
            '<th>Actions</th>' +
          '</tr></thead>' +
          '<tbody>';

      // Mobile cards
      var mobileHtml = '<div class="mobile-cards">';

      courses.forEach(function(course) {
        var sClass = statusClass(course.status);
        // Course IDs from the API are numbers; pass them as numbers so lookups match
        var id = Number(course.id);

        // Table row
        tableHtml +=
          '<tr>' +
            '<td class="course-name">' + escapeHtml(course.name) + '</td>' +
            '<td class="course-desc" title="' + escapeHtml(course.description) + '">' + escapeHtml(course.description) + '</td>' +
            '<td>' + formatDate(course.target_date) + '</td>' +
            '<td><span class="status-badge ' + sClass + '">' + escapeHtml(course.status) + '</span></td>' +
            '<td>' + formatDate(course.created_at) + '</td>' +
            '<td><div class="action-cell">' +
              '<button class="btn btn-primary btn-sm" onclick="openEditModal(' + id + ')">Edit</button>' +
              '<button class="btn btn-danger btn-sm" onclick="deleteCourse(' + id + ')">Remove</button>' +
            '</div></td>' +
          '</tr>';

        // Mobile card
        mobileHtml +=
          '<div class="mobile-card">' +
            '<div class="mc-header">' +
              '<span class="mc-name">' + escapeHtml(course.name) + '</span>' +
              '<span class="status-badge ' + sClass + '">' + escapeHtml(course.status) + '</span>' +
            '</div>' +
            '<div class="mc-desc">' + escapeHtml(course.description) + '</div>' +
            '<div class="mc-meta">' +
              '<span>Target: ' + formatDate(course.target_date) + '</span>' +
              '<span>Created: ' + formatDate(course.created_at) + '</span>' +
            '</div>' +
            '<div class="mc-actions">' +
              '<button class="btn btn-primary btn-sm" onclick="openEditModal(' + id + ')">Edit</button>' +
              '<button class="btn btn-danger btn-sm" onclick="deleteCourse(' + id + ')">Remove</button>' +
            '</div>' +
          '</div>';
      });

      tableHtml += '</tbody></table></div>';
      mobileHtml += '</div>';

      courseListContainer.innerHTML = tableHtml + mobileHtml;
    }

    // ============ Modal ============
    function openEditModal(id) {
      var course = courses.find(function(c) { return c.id === id; });
      if (!course) return;

      document.getElementById('editId').value = course.id;
      document.getElementById('editName').value = course.name;
      document.getElementById('editDescription').value = course.description;
      document.getElementById('editTargetDate').value = course.target_date;
      document.getElementById('editStatus').value = course.status;
      modalAlert.innerHTML = '';

      editModal.classList.add('show');
    }

    function closeModal() {
      editModal.classList.remove('show');
    }

    closeModalBtn.addEventListener('click', closeModal);
    cancelEditBtn.addEventListener('click', closeModal);
    editModal.addEventListener('click', function(e) {
      if (e.target === editModal) closeModal();
    });

    // ============ Event Handlers ============
    courseForm.addEventListener('submit', function(e) {
      e.preventDefault();
      clearAlerts();

      var name = document.getElementById('name').value;
      var description = document.getElementById('description').value;
      var targetDate = document.getElementById('target_date').value;
      var status = document.getElementById('status').value;

      // Clear previous error styling
      ['name', 'description', 'target_date', 'status'].forEach(function(field) {
        document.getElementById(field).classList.remove('error');
      });

      var errors = validateForm(name, description, targetDate, status);

      if (errors.length > 0) {
        showAlert(errors.join('. '), 'error');
        if (!name.trim()) document.getElementById('name').classList.add('error');
        if (!description.trim()) document.getElementById('description').classList.add('error');
        if (!targetDate) document.getElementById('target_date').classList.add('error');
        if (!status) document.getElementById('status').classList.add('error');
        return;
      }

      createCourse({
        name: name.trim(),
        description: description.trim(),
        target_date: targetDate,
        status: status,
      });
    });

    editForm.addEventListener('submit', function(e) {
      e.preventDefault();
      modalAlert.innerHTML = '';

      // Hidden inputs hold strings; convert back to the numeric course ID
      var id = Number(document.getElementById('editId').value);
      var name = document.getElementById('editName').value;
      var description = document.getElementById('editDescription').value;
      var targetDate = document.getElementById('editTargetDate').value;
      var status = document.getElementById('editStatus').value;

      ['editName', 'editDescription', 'editTargetDate', 'editStatus'].forEach(function(field) {
        document.getElementById(field).classList.remove('error');
      });

      var errors = validateForm(name, description, targetDate, status);

      if (errors.length > 0) {
        showModalAlert(errors.join('. '), 'error');
        if (!name.trim()) document.getElementById('editName').classList.add('error');
        if (!description.trim()) document.getElementById('editDescription').classList.add('error');
        if (!targetDate) document.getElementById('editTargetDate').classList.add('error');
        if (!status) document.getElementById('editStatus').classList.add('error');
        return;
      }

      updateCourse(id, {
        name: name.trim(),
        description: description.trim(),
        target_date: targetDate,
        status: status,
      });
    });

    resetBtn.addEventListener('click', function() {
      courseForm.reset();
      ['name', 'description', 'target_date', 'status'].forEach(function(field) {
        document.getElementById(field).classList.remove('error');
      });
    });

    // Expose functions for inline onclick handlers
    window.openEditModal = openEditModal;
    window.deleteCourse = deleteCourse;
    window.fetchCourses = fetchCourses;

    // ============ Init ============
    fetchCourses();
  </script>
</body>
</html>
